# =============================================================================
# Dependabot Configuration
# =============================================================================
# Automatische Dependency-Updates für npm-, Docker- und GitHub-Actions.
#
# Commit prefixes decide whether a merged update is released
# (docker-maintenance.yml dispatches docker-release.yml after the merge):
#   npm            -> fix(deps): PATCH release - the runtime packages are
#                     bundled into the frontend image; devDependencies
#                     (prefix-development: vite, typescript, tailwindcss,
#                     types) -> chore(deps-dev)
#   docker         -> fix(docker): PATCH release, the images are rebuilt
#   github-actions -> chore(actions): no release, never auto-merged
# =============================================================================

version: 2

updates:
  # --- Frontend (npm) --------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:55"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "fix(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
      - "frontend"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      radix:
        patterns:
          - "@radix-ui/*"
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # Major-Updates für Stabilität ignorieren
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # --- Docker-Images ---------------------------------------------------------
  - package-ecosystem: "docker"
    directories:
      - "/pocketbase"
      - "/frontend"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:55"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "fix(docker)"
    labels:
      - "dependencies"
      - "docker"

  # --- GitHub Actions --------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "16:55"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore(actions)"
    labels:
      - "dependencies"
      - "github-actions"
