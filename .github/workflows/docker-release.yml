# =============================================================================
# Docker Release Pipeline
# =============================================================================
# Validiert, baut und veröffentlicht die Docker-Images (PocketBase + Frontend).
#
# Nutzt die Reusable-Workflows aus bauer-group/automation-templates.
# =============================================================================

name: Docker Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'pocketbase/**'
      - 'docker-compose*.yml'
  workflow_dispatch:
    inputs:
      force-release:
        description: 'Force a new release even without conventional commits'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write
  security-events: write
  # Required by docker-build.yml@main: a declared permissions: block sets every
  # unlisted scope to none, and the reusable workflow now needs these three.
  attestations: write   # write the build-provenance attestation
  id-token: write       # OIDC token to sign the attestation (keyless/Sigstore)
  actions: read         # its nested security-analysis job reads run metadata

jobs:
  # ---------------------------------------------------------------------------
  # Compose-Dateien validieren
  # ---------------------------------------------------------------------------
  validate-compose:
    name: Validate Compose Files
    uses: bauer-group/automation-templates/.github/workflows/modules-validate-compose.yml@main
    with:
      compose-files: |
        [
          "docker-compose.development.yml",
          "docker-compose.coolify.yml",
          "docker-compose.traefik.yml"
        ]
      env-template: |
        {
          "STACK_NAME": "pocketbase-collab",
          "SERVICE_HOSTNAME": "collab.example.com",
          "TIME_ZONE": "Etc/UTC",
          "PROXY_NETWORK": "EDGEPROXY",
          "TLS_CERTRESOLVER": "letsencrypt",
          "APP_PORT": "8080",
          "PB_PORT": "8090",
          "PB_VERSION": "0.39.4",
          "DEMO_USER_EMAIL": "demo@example.com",
          "DEMO_USER_PASSWORD": "demo1234"
        }
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Semantic Release (push to main or dispatch on main)
  # ---------------------------------------------------------------------------
  # A dispatch releases too: docker-maintenance.yml dispatches this workflow
  # after a Dependabot merge (a merge made with the GITHUB_TOKEN starts no
  # push run). Needs the compose validation and both image builds of this
  # run (the -validate jobs below, every event): a failed one skips the
  # release and every image push.
  release:
    name: Create Release
    needs: [validate-compose, docker-pocketbase-validate, docker-frontend-validate]
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.validate-compose.result == 'success' &&
      needs.docker-pocketbase-validate.result == 'success' &&
      needs.docker-frontend-validate.result == 'success'
    uses: bauer-group/automation-templates/.github/workflows/modules-semantic-release.yml@main
    with:
      target-branch: 'main'
      # Release the commit this run validated and built - the image jobs
      # below build it too. Unpinned, the release would take the tip of
      # main: a push that landed meanwhile would be tagged untested and be
      # missing from the images. Pinned, nothing is released once main has
      # moved on, and the run for the newer main releases both.
      ref: ${{ github.sha }}
      dry-run: false
      force-release: ${{ inputs.force-release || false }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Build & Push – PocketBase-Image (Release)
  # ---------------------------------------------------------------------------
  docker-pocketbase-release:
    name: Build PocketBase Image (Release)
    needs: [release]
    # Only a run that created a release publishes - never a PR, a branch
    # dispatch or a run that released nothing.
    if: needs.release.outputs.release-created == 'true'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      deploy-environment: 'production'
      publish-to: 'ghcr'
      ghcr-image-name: ${{ github.repository }}/pocketbase
      release-version: ${{ needs.release.outputs.version }}
      update-dockerfile-version: false
      auto-tags: true
      latest-tag: true
      dockerfile-path: './pocketbase/Dockerfile'
      docker-context: './pocketbase'
      platforms: 'linux/amd64'
      push: true
      security-scan: false
      generate-sbom: true
      cache-enabled: false
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Build & Push – Frontend-Image (Release)
  # ---------------------------------------------------------------------------
  docker-frontend-release:
    name: Build Frontend Image (Release)
    needs: [release]
    # Only a run that created a release publishes.
    if: needs.release.outputs.release-created == 'true'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      deploy-environment: 'production'
      publish-to: 'ghcr'
      ghcr-image-name: ${{ github.repository }}/frontend
      release-version: ${{ needs.release.outputs.version }}
      update-dockerfile-version: false
      auto-tags: true
      latest-tag: true
      dockerfile-path: './frontend/Dockerfile'
      docker-context: './frontend'
      platforms: 'linux/amd64'
      push: true
      security-scan: false
      generate-sbom: true
      cache-enabled: false
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Build (ohne Push) – Validierung beider Images bei jedem Event
  # ---------------------------------------------------------------------------
  # Builds both images from this commit on every event - the PR CI that
  # docker-maintenance.yml waits for, and on a push or dispatch a gate of
  # the release. Never pushed.
  docker-pocketbase-validate:
    name: Build PocketBase Image (Validate)
    needs: [validate-compose]
    if: needs.validate-compose.result == 'success'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      publish-to: 'ghcr'
      ghcr-image-name: ${{ github.repository }}/pocketbase
      auto-tags: true
      dockerfile-path: './pocketbase/Dockerfile'
      docker-context: './pocketbase'
      platforms: 'linux/amd64'
      push: false
      security-scan: false
      cache-enabled: false
    secrets: inherit

  docker-frontend-validate:
    name: Build Frontend Image (Validate)
    needs: [validate-compose]
    if: needs.validate-compose.result == 'success'
    uses: bauer-group/automation-templates/.github/workflows/docker-build.yml@main
    with:
      publish-to: 'ghcr'
      ghcr-image-name: ${{ github.repository }}/frontend
      auto-tags: true
      dockerfile-path: './frontend/Dockerfile'
      docker-context: './frontend'
      platforms: 'linux/amd64'
      push: false
      security-scan: false
      cache-enabled: false
    secrets: inherit
